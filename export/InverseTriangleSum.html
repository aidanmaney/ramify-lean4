yping `\\t`.\nFor more information: [Equality](https://lean-lang.org/theorem_proving_in_lean4/quantifiers_and_equality.html#equality)\n\n\nConventions for notations in identifiers:\n\n * The recommended spelling of `=` in identifiers is `eq`.","expr":"@Eq ℕ (n✝ + 1) 0","type":"Prop"},{"doc":"`a - b` computes the difference of `a` and `b`.\nThe meaning of this notation is type-dependent.\n* For natural numbers, this operator saturates at 0: `a - b = 0` when `a ≤ b`. \n\nConventions for notations in identifiers:\n\n * The recommended spelling of `-` in identifiers is `sub` (when used as a binary operator).","expr":"@HSub.hSub ℚ ℚ ℚ instHSub 2 (2 / ↑(n✝ + 1))","type":"ℚ"},{"doc":"`a / b` computes the result of dividing `a` by `b`.\nThe meaning of this notation is type-dependent.\n* For most types like `Nat`, `Int`, `Rat`, `Real`, `a / 0` is defined to be `0`.\n* For `Nat`, `a / b` rounds downwards.\n* For `Int`, `a / b` rounds downwards if `b` is positive or upwards if `b` is negative.\n  It is implemented as `Int.ediv`, the unique function satisfying\n  `a % b + b * (a / b) = a` and `0 ≤ a % b \u003c natAbs b` for `b ≠ 0`.\n  Other rounding conventions are available using the functions\n  `Int.fdiv` (floor rounding) and `Int.tdiv` (truncation rounding).\n* For `Float`, `a / 0` follows the IEEE 754 semantics for division,\n  usually resulting in `inf` or `nan`. \n\nConventions for notations in identifiers:\n\n * The recommended spelling of `/` in identifiers is `div`.","expr":"@HDiv.hDiv ℚ ℚ ℚ instHDiv 2 ↑(n✝ + 1)","type":"ℚ"},{"doc":"`↑x` represents a coercion, which converts `x` of type `α` to type `β`, using\ntypeclasses to resolve a suitable conversion function. You can often leave the\n`↑` off entirely, since coercion is triggered implicitly whenever there is a\ntype error, but in ambiguous cases it can be useful to use `↑` to disambiguate\nbetween e.g. `↑x + ↑y` and `↑(x + y)`.\n","expr":"@Nat.cast ℚ Rat.instNatCast (n✝ + 1)","type":"ℚ"},{"doc":"`a / b` computes the result of dividing `a` by `b`.\nThe meaning of this notation is type-dependent.\n* For most types like `Nat`, `Int`, `Rat`, `Real`, `a / 0` is defined to be `0`.\n* For `Nat`, `a / b` rounds downwards.\n* For `Int`, `a / b` rounds downwards if `b` is positive or upwards if `b` is negative.\n  It is implemented as `Int.ediv`, the unique function satisfying\n  `a % b + b * (a / b) = a` and `0 ≤ a % b \u003c natAbs b` for `b ≠ 0`.\n  Other rounding conventions are available using the functions\n  `Int.fdiv` (floor rounding) and `Int.tdiv` (truncation rounding).\n* For `Float`, `a / 0` follows the IEEE 754 semantics for division,\n  usually resulting in `inf` or `nan`. \n\nConventions for notations in identifiers:\n\n * The recommended spelling of `/` in identifiers is `div`.","expr":"@HDiv.hDiv ℚ ℚ ℚ instHDiv 2 (↑(n✝ + 1) * (↑(n✝ + 1) + 1))","type":"ℚ"},{"doc":"`a * b` computes the product of `a` and `b`.\nThe meaning of this notation is type-dependent. \n\nConventions for notations in identifiers:\n\n * The recommended spelling of `*` in identifiers is `mul`.","expr":"@HMul.hMul ℚ ℚ ℚ instHMul (↑(n✝ + 1)) (↑(n✝ + 1) + 1)","type":"ℚ"},{"doc":"`a + b` computes the sum of `a` and `b`.\nThe meaning of this notation is type-dependent. \n\nConventions for notations in identifiers:\n\n * The recommended spelling of `+` in identifiers is `add`.","expr":"@HAdd.hAdd ℚ ℚ ℚ instHAdd (↑(n✝ + 1)) 1","type":"ℚ"},{"doc":"`apply e` tries to match the current goal against the conclusion of `e`'s type.\nIf it succeeds, then the tactic returns as many subgoals as the number of premises that\nhave not been fixed by type inference or type class resolution.\nNon-dependent premises are added before dependent ones.\n\nThe `apply` tactic uses higher-order pattern matching, type class resolution,\nand first-order unification with dependent types.\n\n\nExtensions:\n\n * * `apply (config := cfg) e` allows for additional configuration (see `Lean.Meta.ApplyConfig`):\n     * `newGoals` controls which new goals are added by `apply`, in which order.\n     * `-synthAssignedInstances` will not synthesize instance implicit arguments if they have been\n       assigned by `isDefEq`.\n     * `+allowSynthFailures` will create new goals when instance synthesis fails, rather than erroring.\n     * `+approx` enables `isDefEq` approximations (see `Lean.Meta.approxDefEq`)."},{"doc":"For any sum along `{0, ..., n - 1}` of a commutative-monoid-valued function, we\ncan verify that it's equal to a different function just by checking differences of adjacent terms\nup to `n`.\n\nThis is a discrete analogue of the fundamental theorem of calculus. ","expr":"@sum_range_induction","type":"∀ {M : Type} [inst : AddCommMonoid M] (f s : ℕ → M),\n  s 0 = 0 → ∀ (n : ℕ), (∀ k \u003c n, s (k + 1) = s k + f k) → ∑ k ∈ range n, f k = s n"},{"doc":"A *hole* (or *placeholder term*), which stands for an unknown term that is expected to be inferred based on context.\nFor example, in `@id _ Nat.zero`, the `_` must be the type of `Nat.zero`, which is `Nat`.\n\nThe way this works is that holes create fresh metavariables.\nThe elaborator is allowed to assign terms to metavariables while it is checking definitional equalities.\nThis is often known as *unification*.\n\nNormally, all holes must be solved for. However, there are a few contexts where this is not necessary:\n* In `match` patterns, holes are catch-all patterns.\n* In some tactics, such as `refine'` and `apply`, unsolved-for placeholders become new goals.\n\nRelated concept: implicit parameters are automatically filled in with holes during the elaboration process.\n\nSee also `?m` syntax (synthetic holes).\n","expr":"fun k => 2 / (↑k * (↑k + 1))","type":"ℕ → ℚ"},{"doc":"A *hole* (or *placeholder term*), which stands for an unknown term that is expected to be inferred based on context.\nFor example, in `@id _ Nat.zero`, the `_` must be the type of `Nat.zero`, which is `Nat`.\n\nThe way this works is that holes create fresh metavariables.\nThe elaborator is allowed to assign terms to metavariables while it is checking definitional equalities.\nThis is often known as *unification*.\n\nNormally, all holes must be solved for. However, there are a few contexts where this is not necessary:\n* In `match` patterns, holes are catch-all patterns.\n* In some tactics, such as `refine'` and `apply`, unsolved-for placeholders become new goals.\n\nRelated concept: implicit parameters are automatically filled in with holes during the elaboration process.\n\nSee also `?m` syntax (synthetic holes).\n","expr":"fun n => if n = 0 then 0 else 2 - 2 / ↑n","type":"ℕ → ℚ"},{"doc":"`rfl : a = a` is the unique constructor of the equality type. This is the\nsame as `Eq.refl` except that it takes `a` implicitly instead of explicitly.\n\nThis is a more powerful theorem than it may appear at first, because although\nthe statement of the theorem is `a = a`, Lean will allow anything that is\ndefinitionally equal to that type. So, for instance, `2 + 2 = 4` is proven in\nLean by `rfl`, because both sides are the same up to definitional equality.\n","expr":"@rfl","type":"∀ {α : Type} {a : α}, a = a"},{"doc":"The `rintro` tactic is a combination of the `intros` tactic with `rcases` to\nallow for destructuring patterns while introducing variables. See `rcases` for\na description of supported patterns. For example, `rintro (a | ⟨b, c⟩) ⟨d, e⟩`\nwill introduce two variables, and then do case splits on both of them producing\ntwo subgoals, one with variables `a d e` and the other with `b c d e`.\n\n`rintro`, unlike `rcases`, also supports the form `(x y : ty)` for introducing\nand type-ascripting multiple variables at once, similar to binders.\n"},{"doc":"`_` is a pattern which ignores the value and gives it an inaccessible name ","expr":"n✝","type":"ℕ"},{"doc":"`norm_num` normalizes numerical expressions in the goal. By default, it supports the operations\n`+` `-` `*` `/` `⁻¹` `^` and `%` over types with (at least) an `AddMonoidWithOne` instance, such as\n`ℕ`, `ℤ`, `ℚ`, `ℝ`, `ℂ`. In addition to evaluating numerical expressions, `norm_num` will use `simp`\nto simplify the goal. If the goal has the form `A = B`, `A ≠ B`, `A \u003c B` or `A ≤ B`, where `A` and\n`B` are numerical expressions, `norm_num` will try to close it. It also has a relatively simple\nprimality prover (available if you import `Mathlib.Tactic.NormNum.Prime`).\n\nThis tactic is extensible. Extensions can allow `norm_num` to evaluate more kinds of expressions, or\nto prove more kinds of propositions (such as, primality of natural numbers). See the `@[norm_num]`\nattribute for further information on extending `norm_num`.\n\n* `norm_num at l` normalizes at location(s) `l`.\n* `norm_num [h1, ...]` adds the arguments `h1, ...` to the `simp` set in addition to the default\n  `simp` set. All options for `simp` arguments are supported, in particular `←`, `↑` and `↓`.\n* `norm_num only` does not use the default `simp` set for simplification. `norm_num only [h1, ...]`\n  uses only the arguments `h1, ...` in addition to the routines tagged `@[norm_num]`.\n  `norm_num only` still performs post-processing steps, like `simp only`, use `norm_num1` if you\n  exclusively want to normalize numerical expressions.\n* `norm_num (config := cfg)` uses `cfg` as configuration for `simp` calls (see the `simp` tactic for\n  further details).\n\nExamples:\n```lean\nexample : 43 ≤ 74 + (33 : ℤ) := by norm_num\nexample : ¬ (7-2)/(2*3) ≥ (1:ℝ) + 2/(3^2) := by norm_num\n```\n"},{"doc":"The `simp` tactic uses lemmas and hypotheses to simplify the main goal target or\nnon-dependent hypotheses. It has many variants:\n- `simp` simplifies the main goal target using lemmas tagged with the attribute `[simp]`.\n- `simp [h₁, h₂, ..., hₙ]` simplifies the main goal target using the lemmas tagged\n  with the attribute `[simp]` and the given `hᵢ`'s, where the `hᵢ`'s are expressions.-\n- If an `hᵢ` is a defined constant `f`, then `f` is unfolded. If `f` has equational lemmas associated\n  with it (and is not a projection or a `reducible` definition), these are used to rewrite with `f`.\n- `simp [*]` simplifies the main goal target using the lemmas tagged with the\n  attribute `[simp]` and all hypotheses.\n- `simp only [h₁, h₂, ..., hₙ]` is like `simp [h₁, h₂, ..., hₙ]` but does not use `[simp]` lemmas.\n- `simp [-id₁, ..., -idₙ]` simplifies the main goal target using the lemmas tagged\n  with the attribute `[simp]`, but removes the ones named `idᵢ`.\n- `simp at h₁ h₂ ... hₙ` simplifies the hypotheses `h₁ : T₁` ... `hₙ : Tₙ`. If\n  the target or another hypothesis depends on `hᵢ`, a new simplified hypothesis\n  `hᵢ` is introduced, but the old one remains in the local context.\n- `simp at *` simplifies all the hypotheses and the target.\n- `simp [*] at *` simplifies target and all (propositional) hypotheses using the\n  other hypotheses.\n"},{"doc":"`ring_nf` simplifies expressions in the language of commutative (semi)rings,\nwhich rewrites all ring expressions into a normal form, allowing variables in the exponents.\n\n`ring_nf` works as both a tactic and a conv tactic.\n\nSee also the `ring` tactic for solving a goal which is an equation in the language\nof commutative (semi)rings.\n\n* `ring_nf!` will use a more aggressive reducibility setting to identify atoms.\n* `ring_nf (config := cfg)` allows for additional configuration (see `RingNF.Config`):\n  * `red`: the reducibility setting (overridden by `!`)\n  * `zetaDelta`: if true, local let variables can be unfolded (overridden by `!`)\n  * `recursive`: if true, `ring_nf` will also recurse into atoms\n* `ring_nf at l1 l2 ...` can be used to rewrite at the given locations.\n\nExamples:\nThis can be used non-terminally to normalize ring expressions in the goal such as\n`⊢ P (x + x + x)` ~> `⊢ P (x * 3)`, as well as being able to prove some equations that\n`ring` cannot because they involve ring reasoning inside a subterm, such as\n`sin (x + y) + sin (y + x) = 2 * sin (x + y)`.\n"},{"doc":"**Sum of the Reciprocals of the Triangular Numbers** ","expr":"inverse_triangle_sum","type":"∀ (n : ℕ), ∑ k ∈ range n, 2 / (↑k * (↑k + 1)) = if n = 0 then 0 else 2 - 2 / ↑n"},{"doc":"`range n` is the set of natural numbers less than `n`. ","expr":"range","type":"ℕ → Finset ℕ"},{"doc":"Rational numbers, implemented as a pair of integers `num / den` such that the\ndenominator is positive and the numerator and denominator are coprime.\n","expr":"Rat","type":"Type"}],"proofs":[{"name":"Theorems100.inverse_triangle_sum","index":2,"proof":{"allGoals":[{"hyps":[{"id":"_uniq.496","isProof":"data","type":"ℕ","username":"n","value":null}],"id":"_uniq.608","type":"∀ k \u003c n, (if k + 1 = 0 then 0 else 2 - 2 / ↑(k + 1)) = (if k = 0 then 0 else 2 - 2 / ↑k) + 2 / (↑k * (↑k + 1))","username":"[anonymous]"},{"hyps":[{"id":"_uniq.496","isProof":"data","type":"ℕ","username":"n","value":null},{"id":"_uniq.652","isProof":"data","type":"ℕ","username":"n✝","value":null}],"id":"_uniq.8867","type":"n✝ + 1 \u003c n → (↑n✝ + 1) ^ 2 = ↑n✝ * (↑n✝ + 1 + 1) + 1","username":"succ"},{"hyps":[{"id":"_uniq.496","isProof":"data","type":"ℕ","username":"n","value":null}],"id":"_uniq.649","type":"0 \u003c n → (if 0 + 1 = 0 then 0 else 2 - 2 / ↑(0 + 1)) = (if 0 = 0 then 0 else 2 - 2 / ↑0) + 2 / (↑0 * (↑0 + 1))","username":"zero"},{"hyps":[{"id":"_uniq.496","isProof":"data","type":"ℕ","username":"n","value":null}],"id":"_uniq.497","type":"∑ k ∈ range n, 2 / (↑k * (↑k + 1)) = if n = 0 then 0 else 2 - 2 / ↑n","username":"[anonymous]"},{"hyps":[{"id":"_uniq.496","isProof":"data","type":"ℕ","username":"n","value":null},{"id":"_uniq.652","isProof":"data","type":"ℕ","username":"n✝","value":null}],"id":"_uniq.653","type":"n✝ + 1 \u003c n →\n  (if n✝ + 1 + 1 = 0 then 0 else 2 - 2 / ↑(n✝ + 1 + 1)) =\n    (if n✝ + 1 = 0 then 0 else 2 - 2 / ↑(n✝ + 1)) + 2 / (↑(n✝ + 1) * (↑(n✝ + 1) + 1))","username":"succ"},{"hyps":[{"id":"_uniq.496","isProof":"data","type":"ℕ","username":"n","value":null},{"id":"_uniq.652","isProof [data-ptw-theme] {
  /* ---- Inputs. The dark block overrides only these. ---- */
  --ptw-bg: var(--vscode-editor-background, #ffffff);
  --ptw-fg: var(--vscode-editor-foreground, #1f2328);
  /* The surface a node box sits on. Light themes already have the page at the
     top of the elevation scale, so a card stays at the background. */
  --ptw-surface: var(--ptw-bg);
  --ptw-hue-goal: #2563eb;
  --ptw-hue-tactic: #15803d;
  --ptw-hue-accent: #b45309;
  /* Warning amber: its own hue (40\xB0), a clear step from the accent orange
     (26\xB0), so a warning ribbon and a temporary mark cannot be mistaken.
     4.9:1 on white; the dark block lifts it. A host colour wins (below). */
  --ptw-hue-warn: #9a6700;
  /* Info blue: VS Code's own editorInfo.foreground defaults (light/dark), the
     fallback where the host variable is absent. */
  --ptw-hue-info: #1a85ff;
  /* Raw syntax hues (VS Code Light+). Muted into --ptw-fg by the recipes. */
  --ptw-raw-keyword: #af00db;
  --ptw-raw-function: #795e26;
  --ptw-raw-variable: #001080;
  --ptw-raw-property: #0451a5;
  --ptw-raw-number: #098658;
  --ptw-raw-string: #a31515;
  --ptw-raw-comment: #008000;
  --ptw-raw-type: #267f99;
  --ptw-raw-sorry: #c53030;

  /* ---- Recipes. Written once; inherited by the dark block. ---- */
  /* A box is its surface with a whisper of hue \u2014 enough to tell goal from
     tactic at a glance, not enough to read as a coloured panel. */
  --ptw-node-goal-fill: #eef2fd;
  --ptw-node-goal-fill: color-mix(in srgb, var(--ptw-surface) 92%, var(--ptw-hue-goal));
  --ptw-node-tactic-fill: #eef7f0;
  --ptw-node-tactic-fill: color-mix(in srgb, var(--ptw-surface) 90%, var(--ptw-hue-tactic));
  --ptw-node-default-fill: var(--ptw-surface);
  /* Borders carry most of the identifying colour, softened toward the page. */
  --ptw-node-goal-stroke: #6692f1;
  --ptw-node-goal-stroke: color-mix(in srgb, var(--ptw-hue-goal) 70%, var(--ptw-bg));
  --ptw-node-tactic-stroke: #57a473;
  --ptw-node-tactic-stroke: color-mix(in srgb, var(--ptw-hue-tactic) 72%, var(--ptw-bg));
  --ptw-node-default-stroke: #939393;
  --ptw-node-default-stroke: color-mix(in srgb, var(--ptw-fg) 55%, var(--ptw-bg));
  --ptw-node-text: var(--ptw-fg);

  /* The cursor/endpoint accent is the one place that should still pop. */
  --ptw-accent: var(--ptw-hue-accent);
  --ptw-accent-text: var(--ptw-bg);

  /* The armed-delete confirm chip. Taken from the editor's OWN error colour
     rather than derived from a hue of ours: this is the one control that
     destroys text, and it should read the way the editor's own destructive
     signals do. Falls back to the syntax palette's sorry red, which is the
     nearest thing here (both mean "something is wrong at this spot"), so the
     standalone app and any host without the variable still get a red. */
  --ptw-danger: var(--vscode-errorForeground, var(--ptw-tok-sorry));

  /* Warning-severity diagnostics ("declaration uses 'sorry'", deprecations).
     The editor's own warning colour, for the same reason --ptw-danger takes its
     error one: a diagnostic drawn in the tree should read the way the squiggle
     for it reads in the buffer. editorWarning.foreground is the registry entry
     behind that squiggle; the fallback is its own amber (--ptw-hue-warn), distinct from the accent.
     (No backticks in here \u2014 this block is a template literal.) */
  --ptw-warn: var(--vscode-editorWarning-foreground, var(--ptw-hue-warn));
  /* Info (a lint's icon in the problems count and the message strip): the
     editor's own info colour, as the Problems view draws a hint. */
  --ptw-info: var(--vscode-editorInfo-foreground, var(--ptw-hue-info));
  /* The LIGHTBULB on the hover bar (batch 4): the editor's own two bulb
     inks \u2014 a plain bulb (fixes or refactorings here), and the autofix bulb
     where one of them is the linter's preferred fix. Fallbacks are the warning
     amber and the info blue, which is what VS Code's defaults are made of. */

  --ptw-lightbulb-autofix: var(--vscode-editorLightBulbAutoFix-foreground, var(--ptw-hue-info));

  /* Context lines are the densest text in the tree, so they are plain
     foreground with the unused ones dimmed \u2014 no hue at all. The dim is 80%
     (2026-10-25: the smallest mix that reaches 4.5:1 on a FOLDED goal box \u2014

     measured on the plain fill only), not lower: it is real content, and on an
     already-low-contrast theme (Solarized Light, whose own foreground is a

  --ptw-hyp-mark: #b4763a;
  --ptw-hyp-mark: color-mix(in srgb, var(--ptw-hue-accent) 72%, var(--ptw-fg));

  /* HOVER ANSWER background \u2014 the lines the tactic under the pointer depends
     on, washed while you hold on its box. Its own token because it has to be
     told apart AT A GLANCE from the tactic DIFF right beside it (and often on
     the same line): the diff says "this changed", this says "this is used",
     and they are different claims about the same text.

     both sit under code that has to stay readable and a heavier wash of one
     would read as the more important fact; hue, because that is the channel
     left once extent is spoken for (the diff paints subterms, this paints the
     whole line). The hue is the ACCENT \u2014 the gutter marker's own \u2014 since this

     the step that wrote it. Same fallback weight, so the harness is

  --ptw-diff-del-border: var(--vscode-diffEditor-removedTextBorder, transparent);

  --ptw-case: #5b6f89;

[data-ptw-theme="dark"] {
  --ptw-bg: var(--vscode-editor-background, #1f1f1f);
  --ptw-fg: var(--vscode-editor-foreground, #e6e6e6);

     than tabulated, so it lands correctly on any dark theme. */

  /* Pastel hues: on a dark page a saturated hue is what reads as neon. */

  --ptw-hue-tactic: #94d3a2;
  --ptw-hue-accent: #e0a06a;
  --ptw-hue-warn: #d9b53f;
  --ptw-hue-info: #3794ff;

  --ptw-raw-function: #dcdcaa;
  --ptw-raw-variable: #9cdcfe;
  --ptw-raw-property: #9cdcfe;
  --ptw-raw-number: #b5cea8;
  --ptw-raw-string: #ce9178;
  --ptw-raw-comment: #6a9955;
  --ptw-raw-type: #4ec9b0;
  --ptw-raw-sorry: #f48771;

  --ptw-node-tactic-fill: #2f3a34;
  --ptw-node-tactic-fill: color-mix(in srgb, var(--ptw-surface) 90%, var(--ptw-hue-tactic));
  --ptw-node-goal-stroke: #5f7bb6;
  --ptw-node-goal-stroke: color-mix(in srgb, var(--ptw-hue-goal) 70%, var(--ptw-bg));
  --ptw-node-tactic-stroke: #73a17d;
  --ptw-node-tactic-stroke: color-mix(in srgb, var(--ptw-hue-tactic) 72%, var(--ptw-bg));
  --ptw-node-default-stroke: #696969;

  --ptw-hyp-unused: #a4a4a4;
  --ptw-hyp-unused: color-mix(in srgb, var(--ptw-fg) 80%, var(--ptw-surface));
  --ptw-hyp-mark: #d9a271;
  --ptw-hyp-mark: color-mix(in srgb, var(--ptw-hue-accent) 72%, var(--ptw-fg));
  --ptw-hyp-lit: #4a3f37;

  --ptw-hyp-lit-strong: #4a3f37;

  --ptw-comment: #989898;
  --ptw-case: #8fa3bf;

  --ptw-prose: #aeb6c0;

  --ptw-link: #696969;
  --ptw-link: color-mix(in srgb, var(--ptw-fg) 43%, var(--ptw-bg));
  --ptw-muted: #989898;
  --ptw-muted: color-mix(in srgb, var(--ptw-fg) 82%, var(--ptw-bg));

/* Keyboard focus, one ring for every chrome button: 1px and INSET, VS Code's
   own idiom, so it follows each control's own radius and never grows outside
   the strip it sits in. --ptw-focus is the editor's focusBorder. Only
   :focus-visible, so a mouse click draws nothing. */

  outline: 1px solid var(--ptw-focus);
  outline-offset: -1px;

   the bar's own paint state, which also reddens the trash). */
[data-ptw-theme] [data-ptw-barbtn]:active > rect {
  fill: var(--ptw-toolbar-active);
}

   \`editor.showFoldingControls: mouseover\` \u2014 hidden on an OPEN goal until the
   box is hovered, faded over 0.5s both ways as the editor's gutter does; a
   FOLDED goal's chevron always shows. Paint only (opacity), so nothing moves;
   keyboard-active is an inline \`opacity: 1\` on the element. */

  opacity: 0;
  transition: opacity 0.5s;
}
[data-ptw-theme] [role="treeitem"]:hover [data-ptw-foldctl="open"] {
  opacity: 1;

[data-ptw-theme] [data-ptw-baritem]:not(:disabled):hover {
  --ptw-bar-item-bg: var(--ptw-chrome-btn);
}
[data-ptw-theme] [data-ptw-baritem]:not(:disabled):active {
  --ptw-bar-item-bg: var(--ptw-toolbar-active);
}

@keyframes ptw-spin { to { transform: rotate(360deg); } }
[data-ptw-theme] [data-ptw-spin] {
  animation: ptw-spin 1.5s steps(30) infinite;
}
@media (prefers-reduced-motion: reduce) {
  [data-ptw-theme] [data-ptw-spin] { animation: none; }
}
/* \u2026in the band, with the status bar's own item hover. */
[data-ptw-theme] [data-ptw-band] [data-ptw-baritem]:not(:disabled):hover {
  --ptw-bar-item-bg: var(--ptw-statusbar-hover);
}

/* A primary button (a toast's Undo): VS Code's button and its hover. */
[data-ptw-theme] [data-ptw-btn] {
  background: var(--ptw-btn-bg);
  color: var(--ptw-btn-fg);
}
[data-ptw-theme] [data-ptw-btn]:hover {
  background: var(--ptw-btn-hover);
}

/* Outline mode (the rail's \u25A1): drop the fills, keep the borders. Last in the
   sheet on purpose \u2014 it has the same specificity as the theme blocks above,
   so source order is what lets it win. Transparent rather than the page
   colour, so the box is genuinely unfilled; the layout's bands are
   overlap-free by construction, so nothing hides behind a node to bleed
   through. */
[data-ptw-fill="none"] {
  --ptw-node-goal-fill: transparent;
  --ptw-node-tactic-fill: transparent;
  --ptw-node-default-fill: transparent;
}

html, body, #root { height: 100%; margin: 0; }
body {
  background: var(--vscode-editor-background);
  color: var(--vscode-editor-foreground);
  font-family: ${Wn};
}
.ptw-viewer { display: flex; flex-direction: column; height: 100%; min-height: 0; }
.ptw-viewer-head {
  display: flex; align-items: center; gap: 10px; white-space: nowrap;
  padding: 6px 12px; min-width: 0; border-bottom: 1px solid ${kt};
  font-size: ${$n}px; color: ${yn};
}
.ptw-viewer-head select, .ptw-viewer-head button {
  font: inherit; color: inherit; background: var(--ptw-chrome-btn, transparent);
  border: 1px solid ${kt}; border-radius: ${Te}px;
  padding: 2px 6px; cursor: pointer;
}
.ptw-viewer-head a { color: inherit; text-decoration: none; }
/* the playground's header grammar: a bold wordmark, QUIET text buttons (no box
   until hover \u2014 the toolbar's wash; pressed = the toolbar's active wash), one
   primary button, the theme as an icon */
.ptw-viewer-brand { font-weight: 600; }
.ptw-viewer-head .ptw-viewer-quiet { background: transparent; border-color: transparent; }
.ptw-viewer-head .ptw-viewer-quiet:hover { background: var(--ptw-toolbar-hover); }
.ptw-viewer-head .ptw-viewer-quiet[aria-pressed="true"] { background: var(--ptw-toolbar-active); }
.ptw-viewer-icon { display: inline-flex; align-items: center; justify-content: center; padding: 3px; }
.ptw-viewer-head a[data-ptw-btn] { padding: 3px 10px; border-radius: ${Te}px; }
.ptw-viewer-file { font-family: var(--vscode-editor-font-family); }
.ptw-viewer-dim { opacity: ${rt}; }
.ptw-viewer-spacer { flex: 1 1 0; }
.ptw-viewer-head select { min-width: 0; max-width: 240px; flex: 0 1 auto; }
.ptw-viewer-main { flex: 1 1 auto; display: flex; min-height: 0; }
.ptw-viewer-tree { flex: 1 1 60%; min-width: 0; min-height: 0; position: relative; }
/* The source on the LEFT and the tree on the right, where the infoview sits
   beside the editor in VS Code. Narrow, the tree stacks first (order reset). */
.ptw-viewer-src {
  order: -1;
  flex: 0 0 var(--ptw-src-w, 40%); min-width: ${lO}px; min-height: 0;
  display: flex; flex-direction: column;
}
/* The split's handle: a hairline in a wider hit strip, between the source
   (order -1, first) and the tree. Drag to resize, double-click to reset,
   \u2190 / \u2192 when focused. */
.ptw-viewer-split {
  order: -1; flex: 0 0 7px; margin: 0 -3px; z-index: 1;
  cursor: col-resize; touch-action: none; outline: none;
  background: linear-gradient(${kt}, ${kt}) center / 1px 100% no-repeat;
}
.ptw-viewer-split:hover, .ptw-viewer-split[data-drag], .ptw-viewer-split:focus-visible {
  background: linear-gradient(var(--ptw-focus), var(--ptw-focus)) center / 3px 100% no-repeat;
}
.ptw-viewer[data-dragging], .ptw-viewer[data-dragging] * { cursor: col-resize !important; user-select: none; }
.ptw-viewer[data-narrow] .ptw-viewer-split { display: none; }
.ptw-viewer[data-narrow] .ptw-viewer-main { flex-direction: column; }
.ptw-viewer[data-narrow] .ptw-viewer-tree { flex: 1 1 58%; }
.ptw-viewer[data-narrow] .ptw-viewer-src {
  order: 0;
  flex: 1 1 42%; min-width: 0;
  border-top: 1px solid ${kt};
}
.ptw-viewer[data-narrow] .ptw-viewer-head { flex-wrap: wrap; row-gap: 6px; }
.ptw-viewer[data-narrow] .ptw-viewer-head select { flex: 1 1 140px; max-width: none; }
.ptw-viewer[data-narrow] .ptw-viewer-file,
.ptw-viewer[data-narrow] .ptw-viewer-install { display: none; }
.ptw-viewer[data-narrow] .ptw-viewer-head { gap: 8px; padding: 6px 10px; }
.ptw-src {
  flex: 1 1 auto; overflow: auto; padding: 6px 0;
  font-family: var(--vscode-editor-font-family); font-size: 12.5px; line-height: 19px;
  white-space: pre; cursor: text;
}
.ptw-src-line { display: flex; padding-right: 12px; }
.ptw-src-gutter {
  flex: 0 0 auto; width: 3.2em; padding-right: 1em; text-align: right;
  opacity: 0.45; user-select: none; border-right: 2px solid transparent;
}
.ptw-src-decl .ptw-src-gutter { opacity: ${rt}; border-right-color: var(--ptw-node-goal-stroke, ${kt}); }
.ptw-src-text { padding-left: 10px; }
.ptw-src-cursor { background: var(--ptw-chrome-lit); }
.ptw-src-hl { background: var(--vscode-diffEditor-insertedTextBackground); border-radius: 2px; }
.ptw-baked-lit { background: var(--ptw-chrome-lit); border-radius: 2px; }
