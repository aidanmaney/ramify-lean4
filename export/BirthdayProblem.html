 with the attribute `[simp]`, but removes the ones named `idᵢ`.\n- `simp at h₁ h₂ ... hₙ` simplifies the hypotheses `h₁ : T₁` ... `hₙ : Tₙ`. If\n  the target or another hypothesis depends on `hᵢ`, a new simplified hypothesis\n  `hᵢ` is introduced, but the old one remains in the local context.\n- `simp at *` simplifies all the hypotheses and the target.\n- `simp [*] at *` simplifies target and all (propositional) hypotheses using the\n  other hypotheses.\n"},{"expr":"Fintype.card_fin","type":"∀ (n : ℕ), ‖Fin n‖ = n"},{"expr":"@Fintype.card_embedding_eq","type":"∀ {α : Type ?u.35} {β : Type ?u.34} [inst : Fintype α] [inst_1 : Fintype β] [emb : Fintype (α ↪ β)],\n  ‖α ↪ β‖ = ‖β‖.descFactorial ‖α‖"},{"expr":"@Fintype.card_fun","type":"∀ {α : Type ?u.41} {β : Type ?u.40} [inst : DecidableEq α] [inst_1 : Fintype α] [inst_2 : Fintype β],\n  ‖α → β‖ = ‖β‖ ^ ‖α‖"},{"doc":"`decide` attempts to prove the main goal (with target type `p`) by synthesizing an instance of `Decidable p`\nand then reducing that instance to evaluate the truth value of `p`.\nIf it reduces to `isTrue h`, then `h` is a proof of `p` that closes the goal.\n\nThe target is not allowed to contain local variables or metavariables.\nIf there are local variables, you can first try using the `revert` tactic with these local variables to move them into the target,\nor you can use the `+revert` option, described below.\n\nOptions:\n- `decide +revert` begins by reverting local variables that the target depends on,\n  after cleaning up the local context of irrelevant variables.\n  A variable is *relevant* if it appears in the target, if it appears in a relevant variable,\n  or if it is a proposition that refers to a relevant variable.\n- `decide +kernel` uses kernel for reduction instead of the elaborator.\n  It has two key properties: (1) since it uses the kernel, it ignores transparency and can unfold everything,\n  and (2) it reduces the `Decidable` instance only once instead of twice.\n- `decide +native` uses the native code compiler (`#eval`) to evaluate the `Decidable` instance,\n  admitting the result via an axiom. This can be significantly more efficient than using reduction, but it is at the cost of increasing the size\n  This can be significantly more efficient than using reduction, but it is at the cost of increasing the size\n  of the trusted code base.\n  Namely, it depends on the correctness of the Lean compiler and all definitions with an `@[implemented_by]` attribute.\n  Like with `+kernel`, the `Decidable` instance is evaluated only once.\n\nLimitation: In the default mode or `+kernel` mode, since `decide` uses reduction to evaluate the term,\n`Decidable` instances defined by well-founded recursion might not work because evaluating them requires reducing proofs.\nReduction can also get stuck on `Decidable` instances with `Eq.rec` terms.\nThese can appear in instances defined using tactics (such as `rw` and `simp`).\nTo avoid this, create such instances using definitions such as `decidable_of_iff` instead.\n\n## Examples\n\nProving inequalities:\n```lean\nexample : 2 + 2 ≠ 5 := by decide\n```\n\nTrying to prove a false proposition:\n```lean\nexample : 1 ≠ 1 := by decide\n/-\ntactic 'decide' proved that the proposition\n  1 ≠ 1\nis false\n-/\n```\n\nTrying to prove a proposition whose `Decidable` instance fails to reduce\n```lean\nopaque unknownProp : Prop\n\nopen scoped Classical in\nexample : unknownProp := by decide\n/-\ntactic 'decide' failed for proposition\n  unknownProp\nsince its 'Decidable' instance reduced to\n  Classical.choice ⋯\nrather than to the 'isTrue' constructor.\n-/\n```\n\n## Properties and relations\n\nFor equality goals for types with decidable equality, usually `rfl` can be used in place of `decide`.\n```lean\nexample : 1 + 1 = 2 := by decide\nexample : 1 + 1 = 2 := by rfl\n```\n"},{"doc":"**Birthday Problem**: set cardinality interpretation. ","expr":"birthday","type":"2 * ‖Fin 23 ↪ Fin 365‖ \u003c ‖Fin 23 → Fin 365‖ ∧ 2 * ‖Fin 22 ↪ Fin on,\n  usually resulting in `inf` or `nan`. \n\nConventions for notations in identifiers:\n\n * The recommended spelling of `/` in identifiers is `div`.","expr":"@HDiv.hDiv ENNReal ENNReal ENNReal instHDiv (2 * ↑42200819302092359872395663074908957253749760700776448000000)\n  ↑‖Fin 23 → Fin 365‖","type":"ENNReal"},{"doc":"`Or a b`, or `a ∨ b`, is the disjunction of propositions. There are two\nconstructors for `Or`, called `Or.inl : a → a ∨ b` and `Or.inr : b → a ∨ b`,\nand you can use `match` or `cases` to destruct an `Or` assumption into the\ntwo cases.\n\n\nConventions for notations in identifiers:\n\n * The recommended spelling of `∨` in identifiers is `or`.","expr":"Or (↑‖Fin 23 → Fin 365‖ ≠ 0) (2 * ↑42200819302092359872395663074908957253749760700776448000000 ≠ 0)","type":"Prop"},{"doc":"`a ≠ b`, or `Ne a b` is defined as `¬ (a = b)` or `a = b → False`,\nand asserts that `a` and `b` are not equal.\n\n\nConventions for notations in identifiers:\n\n * The recommended spelling of `≠` in identifiers is `ne`.","expr":"@Ne ENNReal (↑‖Fin 23 → Fin 365‖) 0","type":"Prop"},{"doc":"`a ≠ b`, or `Ne a b` is defined as `¬ (a = b)` or `a = b → False`,\nand asserts that `a` and `b` are not equal.\n\n\nConventions for notations in identifiers:\n\n * The recommended spelling of `≠` in identifiers is `ne`.","expr":"@Ne ENNReal (2 * ↑42200819302092359872395663074908957253749760700776448000000) 0","type":"Prop"},{"doc":"The equality relation. It has one introduction rule, `Eq.refl`.\nWe use `a = b` as notation for `Eq a b`.\nA fundamental property of equality is that it is an equivalence relation.\n```\nvariable (α : Type) (a b c d : α)\nvariable (hab : a = b) (hcb : c = b) (hcd : c = d)\n\nexample : a = d :=\n  Eq.trans (Eq.trans hab (Eq.symm hcb)) hcd\n```\nEquality is much more than an equivalence relation, however. It has the important property that every assertion\nrespects the equivalence, in the sense that we can substitute equal expressions without changing the truth value.\nThat is, given `h1 : a = b` and `h2 : p a`, we can construct a proof for `p b` using substitution: `Eq.subst h1 h2`.\nExample:\n```\nexample (α : Type) (a b : α) (p : α → Prop)\n        (h1 : a = b) (h2 : p a) : p b :=\n  Eq.subst h1 h2\n\nexample (α : Type) (a b : α) (p : α → Prop)\n    (h1 : a = b) (h2 : p a) : p b :=\n  h1 ▸ h2\n```\nThe triangle in the second presentation is a macro built on top of `Eq.subst` and `Eq.symm`, and you can enter it by typing `\\t`.\nFor more information: [Equality](https://lean-lang.org/theorem_proving_in_lean4/quantifiers_and_equality.html#equality)\n\n\nConventions for notations in identifiers:\n\n * The recommended spelling of `=` in identifiers is `eq`.","expr":"@Eq ℕ (Nat.descFactorial 365 ‖Fin 23‖) 42200819302092359872395663074908957253749760700776448000000","type":"Prop"},{"expr":"Nat.descFactorial 365 ‖Fin 23‖","type":"ℕ"},{"doc":"`Or a b`, or `a ∨ b`, is the disjunction of propositions. There are two\nconstructors for `Or`, called `Or.inl : a → a ∨ b` and `Or.inr : b → a ∨ b`,\nand you can use `match` or `cases` to destruct an `Or` assumption into the\ntwo cases.\n\n\nConventions for notations in identifiers:\n\n * The recommended spelling of `∨` in identifiers is `or`.","expr":"Or (↑(365 ^ 23) ≠ 0) (2 * ↑42200819302092359872395663074908957253749760700776448000000 ≠ 0)","type":"Prop"},{"doc":"`a ≠ b`, or `Ne a b` is defined as `¬ (a = b)` or `a = b → False`,\nand asserts that `a` and `b` are not equal.\n\n\nConventions for notations in identifiers:\n\n * The recommended spelling of `≠` in identifiers is `ne`.","expr":"@Ne ENNReal (↑(365 ^ 23)) 0","type":"Prop"},{"doc":"The less-than relation: `x \u003c y` \n\nConventions for notations in identifiers:\n\n * The recommended spelling of `\u003c` in identifiers is `lt`.","expr":"@LT.lt ENNReal ENNReal.instPartialOrder.toLT\n  (↑42200819302092359872395663074908957253749760700776448000000 / ↑‖Fin 23 → Fin 365‖ * 2) 1","type":"Prop"},{"doc":"`a * b` computes the product of `a` and `b`.\nThe meaning of this notation is type-dependent. \n\nConventions for notations in identifiers:\n\n * The recommended spelling of `*` in identifiers is `mul`.","expr":"@HMul.hMul ENNReal ENNReal ENNReal instHMul\n  (↑42200819302092359872395663074908957253749760700776448000000 / ↑‖Fin 23 → Fin 365‖) 2","type":"ENNReal"},{"doc":"`Or a b`, or `a ∨ b`, is the disjunction of propositions. There are two\nconstructors for `Or`, called `Or.inl : a → a ∨ b` and `Or.inr : b → a ∨ b`,\nand you can use `match` or `cases` to destruct an `Or` assumption into the\ntwo cases.\n\n\nConventions for notations in identifiers:\n\n * The recommended spelling of `∨` in identifiers is `or`.","expr":"Or (2 ≠ 0) (↑42200819302092359872395663074908957253749760700776448000000 / ↑(365 ^ 23) ≠ ⊤)","type":"Prop"},{"doc":"`a ≠ b`, or `Ne a b` is defined as `¬ (a = b)` or `a = b → False`,\nand asserts that `a` and `b` are not equal.\n\n\nConventions for notations in identifiers:\n\n * The recommended spelling of `≠` in identifiers is `ne`.","expr":"@Ne ENNReal (↑42200819302092359872395663074908957253749760700776448000000 / ↑(365 ^ 23)) ⊤","type":"Prop"},{"doc":"The equality relation. It has one introduction rule, `Eq.refl`.\nWe use `a = b` as notation for `Eq a b`.\nA fundamental property of equality is that it is an equivalence relation.\n```\nvariable (α : Type) (a b c d : α)\nvariable (hab : a = b) (hcb : c = b) (hcd : c = d)\n\nexample : a = d :=\n  Eq.trans (Eq.trans hab (Eq.symm hcb)) hcd\n```\nEquality is much more than an equivalence relation, however. It has the important property that every assertion\nrespects the equivalence, in the sense that we can substitute equal expressions without changing the truth value.\nThat is, given `h1 : a = b` and `h2 : p a`, we can construct a proof for `p b` using substitution: `Eq.subst h1 h2`.\nExample:\n```\nexample (α : Type) (a b : α) (p : α → Prop)\n        (h1 : a = b) (h2 : p a) : p b :=\n  Eq.subst h1 h2\n\nexample (α : Type) (a b : α) (p : α → Prop)\n    (h1 : a = b) (h2 : p a) : p b :=\n  h1 ▸ h2\n```\nThe triangle in the second presentation is a macro built on top of `Eq.subst` and `Eq.symm`, and you can enter it by typing `\\t`.\nFor more information: [Equality](https://lean-lang.org/theorem_proving_in_lean4/quantifiers_and_equality.html#equality)\n\n\nConventions for notations in identifiers:\n\n * The recommended spelling of `=` in identifiers is `eq`.","expr":"@Eq ℕ ‖Fin 23 ↪ Fin 365‖ 42200819302092359872395663074908957253749760700776448000000","type":"Prop"},{"expr":"@Fin.measure_apply","type":"∀ {n m : ℕ} {s : Set (Fin n → Fin m)}, ℙ s = ↑|⋯.toFinset| / ↑‖Fin n → Fin m‖"},{"doc":"`generalize_proofs ids* [at locs]?` generalizes proofs in the current goal,\nturning them into new local hypotheses.\n\n- `generalize_proofs` generalizes proofs in the target.\n- `generalize_proofs at h₁ h₂` generalized proofs in hypotheses `h₁` and `h₂`.\n- `generalize_proofs at *` generalizes proofs in the entire local context.\n- `generalize_proofs pf₁ pf₂ pf₃` uses names `pf₁`, `pf₂`, and `pf₃` for the generalized proofs.\n  These can be `_` to not name proofs.\n\nIf a proof is already present in the local context, it will use that rather than create a new\nlocal hypothesis.\n\nWhen doing `generalize_proofs at h`, if `h` is a let binding, its value is cleared,\nand furthermore if `h` duplicates a preceding local hypothesis then it is eliminated.\n\nThe tactic is able to abstract proofs from under binders, creating universally quantified\nproofs in the local context.\nTo disable this, use `generalize_proofs -abstract`.\nThe tactic is also set to recursively abstract proofs from the types of the generalized proofs.\nThis can be controlled with the `maxDepth` configuration option,\nwith `generalize_proofs (config := { maxDepth := 0 })` turning this feature off.\n\nFor example:\n```lean\ndef List.nthLe {α} (l : List α) (n : ℕ) (_h : n \u003c l.length) : α := sorry\nexample : List.nthLe [1, 2] 1 (by simp) = 2 := by\n  -- ⊢ [1, 2].nthLe 1 ⋯ = 2\n  generalize_proofs h\n  -- h : 1 \u003c [1, 2].length\n  -- ⊢ [1, 2].nthLe 1 h = 2\n```\n"},{"expr":"pf✝¹","type":"{f | Function.Injective f}.Finite"},{"doc":"The `have` tactic is for adding opaque definitions and hypotheses to the local context of the main goal.\nThe definitions forget their associated value and cannot be unfolded, unlike definitions added by the `let` tactic.\n\n* `have h : t := e` adds the hypothesis `h : t` if `e` is a term of type `t`.\n* `have h := e` uses the type of `e` for `t`.\n* `have : t := e` and `have := e` use `this` for the name of the hypothesis.\n* `have pat := e` for a pattern `pat` is equivalent to `match e with | pat => _`,\n  where `_` stands for the tactics that follow this one.\n  It is convenient for types that have only one applicable constructor.\n  For example, given `h : p ∧ q ∧ r`, `have ⟨h₁, h₂, h₃⟩ := h` produces the\n  hypotheses `h₁ : p`, `h₂ : q`, and `h₃ : r`.\n* The syntax `have (eq := h) pat := e` is equivalent to `match h : e with | pat => _`,\n  which adds the equation `h : e = pat` to the local context.\n\nThe tactic supports all the same syntax variants and options as the `have` term.\n\n## Properties and relations\n\n* It is not possible to unfold a variable introduced using `have`, since the definition's value is forgotten.\n  The `let` tactic introduces definitions that can be unfolded.\n* The `have h : t := e` is like doing `let h : t := e; clear_value h`.\n* The `have` tactic is preferred for propositions, and `let` is preferred for non-propositions.\n* Sometimes `have` is used for non-propositions to ensure that the variable is never unfolded,\n  which may be important for performance reasons.\n    Consider using the equivalent `let +nondep` to indicate the intent.\n\n"},{"expr":"@Set.Finite.toFinset (Fin 23 → Fin 365) {f | Function.Injective f} hfin","type":"Finset (Fin 23 → Fin 365)"},{"doc":"`trans` applies to a goal whose target has the form `t ~ u` where `~` is a transitive relation,\nthat is, a relation which has a transitivity lemma tagged with the attribute [trans].\n\n* `trans s` replaces the goal with the two subgoals `t ~ s` and `s ~ u`.\n* If `s` is omitted, then a metavariable is used instead.\n\nAdditionally, `trans` also applies to a goal whose target has the form `t → u`,\nin which case it replaces the goal with `t → s` and `s → u`.\n"},{"expr":"@Fintype.card_coe","type":"∀ {α : Type} (s : Finset α) [inst : Fintype ↥s], ‖↥s‖ = |s|"},{"doc":"`apply e` tries to match the current goal against the conclusion of `e`'s type.\nIf it succeeds, then the tactic returns as many subgoals as the number of premises that\nhave not been fixed by type inference or type class resolution.\nNon-dependent premises are added before dependent ones.\n\nThe `apply` tactic uses higher-order pattern matching, type class resolution,\nand first-order unification with dependent types.\n\n\nExtensions:\n\n * * `apply (config := cfg) e` allows for additional configuration (see `Lean.Meta.ApplyConfig`):\n     * `newGoals` controls which new goals are added by `apply`, in which order.\n     * `-synthAssignedInstances` will not synthesize instance implicit arguments if they have been\n       assigned by `isDefEq`.\n     * `+allowSynthFailures` will create new goals when instance synthesis fails, rather than erroring.\n     * `+approx` enables `isDefEq` approximations (see `Lean.Meta.approxDefEq`)."},{"expr":"@Fintype.card_congr","type":"∀ {α β : Type} [inst : Fintype α] [inst_1 : Fintype β] (f : α ≃ β), ‖α‖ = ‖β‖"},{"doc":"Note that this is an equality of types not holding definitionally. Use wisely. ","expr":"@Set.Finite.coeSort_toFinset","type":"∀ {α : Type} {s : Set α} (hs : s.Finite), ↥hs.toFinset = ↑s"},{"expr":"@Set.coe_setOf","type":"∀ {α : Type} (p : α → Prop), ↑{x | p x} = { x // p x }"},{"doc":"`exact e` closes the main goal if its target type matches that of `e`.\n"},{"doc":"The type of embeddings `α ↪ β` is equivalent to\nthe subtype of all injective functions `α → β`. ","expr":"Equiv.subtypeInjectiveEquivEmbedding","type":"(α β : Type) → { f // Function.Injective f } ≃ (α ↪ β)"},{"doc":"A *hole* (or *placeholder term*), which stands for an unknown term that is expected to be inferred based on context.\nFor example, in `@id _ Nat.zero`, the `_` must be the type of `Nat.zero`, which is `Nat`.\n\nThe way this works is that holes create fresh metavariables.\nThe elaborator is allowed to assign terms to metavariables while it is checking definitional equalities.\nThis is often known as *unification*.\n\nNormally, all holes must be solved for. However, there are a few contexts where this is not necessary:\n* In `match` patterns, holes are catch-all patterns.\n* In some tactics, such as `refine'` and `apply`, unsolved-for placeholders become new goals.\n\nRelated concept: implicit parameters are automatically filled in with holes during the elaboration process.\n\nSee also `?m` syntax (synthetic holes).\n","expr":"Fin 23","type":"Type"},{"doc":"A *hole* (or *placeholder term*), which stands for an unknown term that is expected to be inferred based on context.\nFor example, in `@id _ Nat.zero`, the `_` must be the type of `Nat.zero`, which is `Nat`.\n\nThe way this works is that holes create fresh metavariables.\nThe elaborator is allowed to assign terms to metavariables while it is checking definitional equalities.\nThis is often known as *unification*.\n\nNormally, all holes must be solved for. However, there are a few contexts where this is not necessary:\n* In `match` patterns, holes are catch-all patterns.\n* In some tactics, such as `refine'` and `apply`, unsolved-for placeholders become new goals.\n\nRelated concept: implicit parameters are automatically filled in with holes during the elaboration process.\n\nSee also `?m` syntax (synthetic holes).\n","expr":"Fin 365","type":"Type"},{"expr":"@Fintype.card_embedding_eq","type":"∀ {α β : Type} [inst : Fintype α] [inst_1 : Fintype β] [emb : Fintype (α ↪ β   --ptw-hue-goal: #2563eb;
  --ptw-hue-tactic: #15803d;
  --ptw-hue-accent: #b45309;
  /* Warning amber: its own hue (40\xB0), a clear step from the accent orange
     (26\xB0), so a warning ribbon and a temporary mark cannot be mistaken.
     4.9:1 on white; the dark block lifts it. A host colour wins (below). */

     fallback where the host variable is absent. */

  /* Raw syntax hues (VS Code Light+). Muted into --ptw-fg by the recipes. */

  --ptw-raw-function: #795e26;
  --ptw-raw-variable: #001080;
  --ptw-raw-property: #0451a5;
  --ptw-raw-number: #098658;
  --ptw-raw-string: #a31515;
  --ptw-raw-comment: #008000;
  --ptw-raw-type: #267f99;
  --ptw-raw-sorry: #c53030;

  /* ---- Recipes. Written once; inherited by the dark block. ---- */
  /* A box is its surface with a whisper of hue \u2014 enough to tell goal from
     tactic at a glance, not enough to read as a coloured panel. */

  --ptw-node-goal-fill: color-mix(in srgb, var(--ptw-surface) 92%, var(--ptw-hue-goal));
  --ptw-node-tactic-fill: #eef7f0;
  --ptw-node-tactic-fill: color-mix(in srgb, var(--ptw-surface) 90%, var(--ptw-hue-tactic));
  --ptw-node-default-fill: var(--ptw-surface);
  /* Borders carry most of the identifying colour, softened toward the page. */
  --ptw-node-goal-stroke: #6692f1;
  --ptw-node-goal-stroke: color-mix(in srgb, var(--ptw-hue-goal) 70%, var(--ptw-bg));
  --ptw-node-tactic-stroke: #57a473;
  --ptw-node-tactic-stroke: color-mix(in srgb, var(--ptw-hue-tactic) 72%, var(--ptw-bg));
  --ptw-node-default-stroke: #939393;

[data-ptw-theme="dark"] {

  --ptw-fg: var(--vscode-editor-foreground, #e6e6e6);

     than tabulated, so it lands correctly on any dark theme. */

  --ptw-surface: color-mix(in srgb, var(--ptw-bg) 90%, var(--ptw-fg));
  /* Pastel hues: on a dark page a saturated hue is what reads as neon. */

  --ptw-hue-tactic: #94d3a2;
  --ptw-hue-accent: #e0a06a;
  --ptw-hue-warn: #d9b53f;
  --ptw-hue-info: #3794ff;
  /* Raw syntax hues (VS Code Dark+), muted into --ptw-fg by the recipes. */
  --ptw-raw-keyword: #c586c0;
  --ptw-raw-function: #dcdcaa;
  --ptw-raw-variable: #9cdcfe;
  --ptw-raw-property: #9cdcfe;
  --ptw-raw-number: #b5cea8;
  --ptw-raw-string: #ce9178;
  --ptw-raw-comment: #6a9955;
  --ptw-raw-type: #4ec9b0;
  --ptw-raw-sorry: #f48771;

  --ptw-node-goal-fill: color-mix(in srgb, var(--ptw-surface) 92%, var(--ptw-hue-goal));
  --ptw-node-tactic-fill: #2f3a34;
  --ptw-node-tactic-fill: color-mix(in srgb, var(--ptw-surface) 90%, var(--ptw-hue-tactic));
  --ptw-node-goal-stroke: #5f7bb6;
  --ptw-node-goal-stroke: color-mix(in srgb, var(--ptw-hue-goal) 70%, var(--ptw-bg));
  --ptw-node-tactic-stroke: #73a17d;
  --ptw-node-tactic-stroke: color-mix(in srgb, var(--ptw-hue-tactic) 72%, var(--ptw-bg));
  --ptw-node-default-stroke: #696969;
  --ptw-node-default-stroke: color-mix(in srgb, var(--ptw-fg) 43%, var(--ptw-bg));

  --ptw-prose: #aeb6c0;

   token layer of the skin before 2026-10-04 \u2014 the host's hover, menu,
   notification, marker-navigation, sticky-scroll, word-highlight and

   the order. Paint only: no token here is measured. */

  --ptw-comment-text: var(--ptw-comment);
  --ptw-ghost-text: var(--ptw-comment);

  --ptw-hover-border: var(--ptw-chrome-border);
  --ptw-hover-fg: var(--ptw-chrome-ink);
  --ptw-menu-bg: var(--ptw-chrome-bg);
  --ptw-menu-fg: var(--ptw-chrome-ink);
  --ptw-menu-border: var(--ptw-chrome-border);
  --ptw-menu-sep: color-mix(in srgb, var(--ptw-chrome-border) 76%, transparent);
  --ptw-menu-sel-bg: var(--ptw-chrome-lit);
  --ptw-menu-sel-fg: var(--ptw-chrome-ink);
  --ptw-sticky-bg: var(--ptw-bg);
  --ptw-sticky-border: var(--ptw-chrome-border);
  --ptw-sticky-shadow: transparent;
  --ptw-notif-bg: var(--ptw-chrome-bg);
  --ptw-notif-fg: var(--ptw-chrome-ink);
  --ptw-notif-border: var(--ptw-chrome-border);
  --ptw-marker-bg: var(--ptw-chrome-bg);
  --ptw-diag-error-edge: var(--ptw-danger);
  --ptw-diag-warn-edge: var(--ptw-warn);
  --ptw-diag-lint-edge: var(--ptw-comment);
  --ptw-diag-error-wash: color-mix(in srgb, var(--ptw-danger) 13%, var(--ptw-chrome-bg));
  --ptw-diag-warn-wash: color-mix(in srgb, var(--ptw-warn) 13%, var(--ptw-chrome-bg));

   :focus-visible, so a mouse click draws nothing. */

  outline: 1px solid var(--ptw-focus);

   the bar's own paint state, which also reddens the trash). */
[data-ptw-theme] [data-ptw-barbtn]:active > rect {
  fill: var(--ptw-toolbar-active);
}

[data-ptw-theme] [data-ptw-baritem]:not(:disabled):active {

}

   overlap-free by construction, so nothing hides behind a node to bleed
   through. */

  --ptw-node-goal-fill: transparent;
  --ptw-node-tactic-fill: transparent;
  --ptw-node-default-fill: transparent;

.ptw-viewer-head {
  display: flex; align-items: center; gap: 10px; white-space: nowrap;
  padding: 6px 12px; min-width: 0; border-bottom: 1px solid ${Me};
  font-size: ${To}px; color: ${en};
}
.ptw-viewer-head select, .ptw-viewer-head button {
  font: inherit; color: inherit; background: var(--ptw-chrome-btn, transparent);
  border: 1px solid ${Me}; border-radius: ${Mt}px;
  padding: 2px 6px; cursor: pointer;
}
.ptw-viewer-head button[aria-pressed="true"] { background: var(--ptw-chrome-lit); }
.ptw-viewer-head a { color: inherit; }
.ptw-viewer-file { font-family: var(--vscode-editor-font-family); }
.ptw-viewer-dim { opacity: ${ue}; }
.ptw-viewer-spacer { flex: 1 1 0; }
.ptw-viewer-head select { min-width: 0; max-width: 240px; flex: 0 1 auto; }
.ptw-viewer-main { flex: 1 1 auto; display: flex; min-height: 0; }
.ptw-viewer-tree { flex: 1 1 60%; min-width: 0; min-height: 0; position: relative; }
/* The source on the LEFT and the tree on the right, where the infoview sits
   beside the editor in VS Code. Narrow, the tree stacks first (order reset). */
.ptw-viewer-src {
  order: -1;
  flex: 0 0 var(--ptw-src-w, 40%); min-width: ${kL}px; min-height: 0;
  display: flex; flex-direction: column;
}
/* The split's handle: a hairline in a wider hit strip, between the source

   \u2190 / \u2192 when focused. */
.ptw-viewer-split {
  order: -1; flex: 0 0 7px; margin: 0 -3px; z-index: 1;
  cursor: col-resize; touch-action: none; outline: none;
  background: linear-gradient(${Me}, ${Me}) center / 1px 100% no-repeat;
}
.ptw-viewer-split:hover, .ptw-viewer-split[data-drag], .ptw-viewer-split:focus-visible {

}
.ptw-viewer[data-dragging], .ptw-viewer[data-dragging] * { cursor: col-resize !important; user-select: none; }
.ptw-viewer[data-narrow] .ptw-viewer-split { display: none; }
.ptw-viewer[data-narrow] .ptw-viewer-main { flex-direction: column; }
.ptw-viewer[data-narrow] .ptw-viewer-tree { flex: 1 1 58%; }
.ptw-viewer[data-narrow] .ptw-viewer-src {
  order: 0;
  flex: 1 1 42%; min-width: 0;
  border-top: 1px solid ${Me};
}
.ptw-viewer[data-narrow] .ptw-viewer-head { flex-wrap: wrap; row-gap: 6px; }
.ptw-viewer[data-narrow] .ptw-viewer-head select { flex: 1 1 140px; max-width: none; }
.ptw-viewer[data-narrow] .ptw-viewer-file,
.ptw-viewer[data-narrow] .ptw-viewer-install { display: none; }
.ptw-viewer[data-narrow] .ptw-viewer-head { gap: 8px; padding: 6px 10px; }
.ptw-src {
  flex: 1 1 auto; overflow: auto; padding: 6px 0;
  font-family: var(--vscode-editor-font-family); font-size: 12.5px; line-height: 19px;
  white-space: pre; cursor: text;
}
.ptw-src-line { display: flex; padding-right: 12px; }
.ptw-src-gutter {
  flex: 0 0 auto; width: 3.2em; padding-right: 1em; text-align: right;
  opacity: 0.45; user-select: none; border-right: 2px solid transparent;
}
.ptw-src-decl .ptw-src-gutter { opacity: ${ue}; border-right-color: var(--ptw-node-goal-stroke, ${Me}); }
.ptw-src-text { padding-left: 10px; }
.ptw-src-cursor { background: var(--ptw-chrome-lit); }
.ptw-src-hl { background: var(--vscode-diffEditor-insertedTextBackground); border-radius: 2px; }
.ptw-baked-lit { background: var(--ptw-chrome-lit); border-radius: 2px; }
.ptw-viewer-msg { padding: 24px; font-size: ${To}px; max-width: 640px; line-height: 1.5; }
