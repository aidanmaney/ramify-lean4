# Lake package for the proof-tree harness: a self-owned wrapper around
# paperproof's BetterParser that emits NDJSON for the web visualizer.
name = "ppharness"
defaultTargets = ["ppharness"]

# --- Paperproof's Lean library (contains `Services.BetterParser`) -------------
# Pinned to an exact commit, NOT `main`: upstream's 2026-07 "switch to module
# system" rewrite means a floating rev would silently pull sources our
# pre-module imports can't share a build with. This rev's BetterParser structs
# are field-for-field identical to upstream main (verified 2026-08), so the
# web/src/paperproof.ts mirror is unaffected. The library is core-only — it
# parses InfoTrees and needs no Mathlib to *build*.
[[require]]
name = "Paperproof"
git = "https://github.com/Paper-Proof/paperproof.git"
subDir = "lean"
rev = "c85fb0b45ce9ebaaa4715c7d043aadda80306c46"

# --- Mathlib --------------------------------------------------------------
# Required only so Mathlib's oleans land on LEAN_PATH (via `lake env`): that is
# what lets `processHeader` elaborate real `import Mathlib` proofs. Pinned to
# the tag matching the toolchain. (The old v4.27.0 pin cited a v4.29 async
# blocker — "tactic subtrees elaborate asynchronously and aren't attached" —
# falsified by probes on v4.32.2: `Elab.async` defaults to FALSE for embedded
# drivers, the info-tree collection in `IO.processCommands` is unchanged
# v4.27→v4.33, and both the CLI harvest and the live-server widget path were
# measured to produce identical, complete step lists on v4.32.2.)
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.2"

# --- Source-comment extraction shared by the CLI and the widget -------------
# (file: ProofTreeComments.lean) Comments are parser trivia, absent from the
# InfoTree, so both data paths re-lex the command's raw source through this.
[[lean_lib]]
name = "ProofTreeComments"

# --- The supplemental parser (file: ProofTreeRecover.lean) -------------------
# Recovers what the vendored BetterParser structurally cannot see (failed
# tactics roll their info subtree back; term-mode proofs never make one).
# The ONE module allowed to import Paperproof types — ProofTreeComments stays
# plain `import Lean` — and both wires merge its output into the parse result.
[[lean_lib]]
name = "ProofTreeRecover"

# --- Our reusable parsing library (file: Ppharness.lean) ---
[[lean_lib]]
name = "Ppharness"

# --- The infoview widget's bundled JS (built by `npm run build:widget`) -------
# `include_str` (used below) is a bare file read at elaboration time — Lake
# cannot see it as a dependency on its own, so a `lake build` after only the JS
# changed is a silent no-op that keeps serving the OLD bundle (hit this for
# real: Ramify.lean's own source never changed, so Lake never noticed
# `web/dist/proofTreeWidget.js` had). Declaring it as a tracked `input_file` and
# wiring it into the library below via `needs` closes that gap — confirmed with
# a real edit-rebuild cycle (the deprecated `extraDepTargets` field looked
# equivalent on paper but silently failed to propagate the change; `needs` is
# the one that actually forces re-elaboration).
[[input_file]]
name = "proofTreeWidgetJs"
path = "../web/dist/proofTreeWidget.js"
text = true

# --- The Lean infoview user-widget (file: Ramify.lean) ---
# Renders the proof tree in the VS Code infoview over RPC, reusing the same
# `BetterParser_Tree` as the CLI. Imports ProofWidgets (available transitively via
# Mathlib) and `include_str`s the bundled renderer, so run `npm run build:widget`
# in `web/` before `lake build` (see CLAUDE.md). `needs` makes that second step
# actually pick up the change (see the `input_file` comment above).
[[lean_lib]]
name = "Ramify"
needs = ["proofTreeWidgetJs"]

# --- Our CLI executable (file: Main.lean, provides `def main`) ---
# `supportInterpreter` is required so the binary can run Mathlib's `@[init]`
# declarations when it loads an `import Mathlib` environment at runtime.
[[lean_exe]]
name = "ppharness"
root = "Main"
supportInterpreter = true
